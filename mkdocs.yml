site_name: Swift Mastery Path
site_description: A structured, module-wise Swift training program from entry level to master level.
site_url: https://sigilipelli.github.io/swift-mastery-path/
repo_url: https://github.com/SIGILIPELLI/swift-mastery-path
repo_name: swift-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Setup & First Program": level-1/01-setup.md
      - "02 · Variables & Types": level-1/02-variables-types.md
      - "03 · Control Flow": level-1/03-control-flow.md
      - "04 · Functions": level-1/04-functions.md
      - "05 · Optionals Basics": level-1/05-optionals-basics.md
      - "06 · Collections": level-1/06-collections.md
      - "07 · Structs & Classes Basics": level-1/07-structs-classes.md
      - "08 · Enums": level-1/08-enums.md
      - "09 · Closures Intro": level-1/09-closures-intro.md
      - "10 · Project — CLI To-Do App": level-1/10-project-todo-cli.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "01 · OOP Deep Dive": level-2/01-oop-deep-dive.md
      - "02 · Optionals Advanced": level-2/02-optionals-advanced.md
      - "03 · Error Handling": level-2/03-error-handling.md
      - "04 · Closures Advanced": level-2/04-closures-advanced.md
      - "05 · Generics": level-2/05-generics.md
      - "06 · Testing with XCTest": level-2/06-testing-xctest.md
      - "07 · Working with JSON": level-2/07-json-codable.md
      - "08 · Swift Package Manager": level-2/08-swift-package-manager.md
      - "09 · Property Wrappers Intro": level-2/09-property-wrappers.md
      - "10 · Project — Weather CLI": level-2/10-project-weather-cli.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-3/*.md
  level-4/*.md
